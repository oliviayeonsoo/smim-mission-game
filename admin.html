<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMIM · 운영자 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  @font-face{font-family:'HS굴토끼체';src:url('assets/fonts/HSGooltokki.ttf') format('truetype');font-display:swap;}
  :root { color-scheme: light; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:#f5f9f4;font-family:'Pretendard',system-ui,sans-serif;color:#2d4a3e;}
  .title-font{font-family:'HS굴토끼체',system-ui,sans-serif;font-weight:400;}
  @keyframes spin{to{transform:rotate(360deg)}}

  #stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#eef4ec;}

  /* ---------- login ---------- */
  #login-screen{width:100%;max-width:360px;text-align:center;}
  #login-screen h1{margin:0 0 6px;font-size:26px;color:#315c51;}
  #login-screen p.sub{margin:0 0 26px;font-size:14px;font-weight:300;color:#6f8b7f;}
  .field{margin-bottom:12px;text-align:left;}
  .input{width:100%;box-sizing:border-box;padding:13px 15px;border-radius:14px;border:1px solid #d8e4dc;background:#fff;color:#2d4a3e;font-size:15px;font-family:'Pretendard';outline:none;}
  .input:focus{border-color:#346d5e;}
  .btn{width:100%;border:none;cursor:pointer;padding:15px;border-radius:14px;background:#346d5e;color:#e3e79b;font-family:'Pretendard';font-weight:700;font-size:16px;box-shadow:0 10px 26px rgba(52,109,94,.25);transition:filter .15s;margin-top:6px;}
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.55;cursor:default;}
  .err{min-height:16px;margin:10px 0 0;font-size:12.5px;color:#c0392b;}

  /* ---------- dashboard ---------- */
  #dashboard-screen{width:100%;max-width:760px;display:none;}
  .dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .dash-header h1{margin:0;font-size:22px;color:#315c51;}
  .dash-header p{margin:2px 0 0;font-size:12.5px;color:#8aa598;}
  .logout-btn{border:none;cursor:pointer;padding:9px 16px;border-radius:12px;background:#fff;border:1px solid #d8e4dc;color:#3f6459;font-size:13px;font-family:'Pretendard';}
  .logout-btn:hover{background:#eef4ec;}

  .card{border-radius:22px;background:#fff;border:1px solid #e4ede3;padding:22px;margin-bottom:18px;}
  .card h2{margin:0 0 4px;font-size:15px;font-weight:600;color:#2d4a3e;}
  .card p.hint{margin:0 0 16px;font-size:12.5px;color:#8aa598;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eef2ed;}
  th{font-size:11.5px;font-weight:500;color:#8aa598;letter-spacing:.3px;text-transform:uppercase;}
  tbody tr{cursor:pointer;transition:background .12s;}
  tbody tr:hover{background:#f5f9f4;}
  tbody tr.selected{background:#e9f3ec;}
  td.num,th.num{text-align:right;font-family:'JetBrains Mono',monospace;}
  td.name{font-weight:600;color:#2d4a3e;}
  tfoot td{border-bottom:none;border-top:1px solid #d8e4dc;font-weight:700;color:#315c51;padding-top:12px;}

  .chart-legend{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:12px;color:#6f8b7f;}
  .chart-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:12px;}
  .chart-legend .dot:first-child{margin-left:0;}
  #detail-chart svg{display:block;width:100%;}

  .loading,.empty,.error{padding:20px 0;text-align:center;font-size:13.5px;color:#8aa598;}
  .spinner{width:26px;height:26px;margin:0 auto 10px;border-radius:50%;border:3px solid #d8e4dc;border-top-color:#346d5e;animation:spin .8s linear infinite;}
  .error{color:#c0392b;}

  .add-cafe-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .add-cafe-grid .field-full{grid-column:1 / -1;}
  .add-cafe-grid label{display:block;font-size:12px;color:#6f8b7f;margin-bottom:4px;}
  .add-cafe-msg{min-height:16px;margin:10px 0 0;font-size:12.5px;}
  .add-cafe-msg.ok{color:#2e7d4f;}
  .add-cafe-msg.err{color:#c0392b;}
  .btn-small{width:auto;padding:9px 16px;border-radius:12px;font-size:13.5px;margin-top:0;box-shadow:none;}

  .qr-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .qr-row img{width:140px;height:140px;border-radius:14px;border:1px solid #e4ede3;background:#fff;}
  .qr-info{flex:1;min-width:200px;}
  .qr-url{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#3f6459;background:#f5f9f4;border-radius:10px;padding:8px 10px;word-break:break-all;margin-bottom:8px;}
  .qr-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .link-btn{border:1px solid #d8e4dc;background:#fff;color:#3f6459;padding:8px 14px;border-radius:10px;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-block;}
  .link-btn:hover{background:#f5f9f4;}
</style>
</head>
<body>

<div id="stage">

  <!-- ============ LOGIN ============ -->
  <section id="login-screen">
    <h1 class="title-font">운영자 대시보드</h1>
    <p class="sub">전체 카페의 방문·참여 통계를 확인해요</p>
    <div class="field">
      <input id="email-input" type="email" class="input" placeholder="이메일" autocomplete="username">
    </div>
    <div class="field">
      <input id="password-input" type="password" class="input" placeholder="비밀번호" autocomplete="current-password">
    </div>
    <button class="btn" id="login-btn">로그인</button>
    <p class="err" id="login-err"></p>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <section id="dashboard-screen">
    <div class="dash-header">
      <div>
        <h1 class="title-font">SMIM 운영자 대시보드</h1>
        <p id="signed-in-as"></p>
      </div>
      <button class="logout-btn" id="logout-btn">로그아웃</button>
    </div>

    <div class="card">
      <h2>새 카페 추가</h2>
      <p class="hint">등록하면 바로 QR코드까지 만들어져요</p>
      <div class="add-cafe-grid">
        <div class="field-full">
          <label for="new-cafe-id">카페 아이디 (URL에 쓰임, 영문/숫자/하이픈)</label>
          <input id="new-cafe-id" class="input" placeholder="예: jem-in-brown">
        </div>
        <div>
          <label for="new-cafe-name">카페 이름</label>
          <input id="new-cafe-name" class="input" placeholder="예: 젬인브라운">
        </div>
        <div>
          <label for="new-cafe-wifi">와이파이 비밀번호</label>
          <input id="new-cafe-wifi" class="input" placeholder="iwanttogohome">
        </div>
        <div class="field-full">
          <label for="new-cafe-admin-pw">카페 자체 관리자 비밀번호 (사장님용, 게임 화면 톱니바퀴)</label>
          <input id="new-cafe-admin-pw" class="input" placeholder="숫자 4자리 등">
        </div>
      </div>
      <button class="btn btn-small" id="add-cafe-btn" style="margin-top:14px;">카페 추가</button>
      <p class="add-cafe-msg" id="add-cafe-msg"></p>
    </div>

    <div class="card">
      <h2>카페별 요약</h2>
      <p class="hint" id="summary-hint">불러오는 중...</p>
      <div id="summary-wrap"></div>
    </div>

    <div class="card">
      <h2 id="detail-title">일별 추이</h2>
      <p class="hint">표에서 카페를 선택하면 여기에 날짜별 통계와 QR코드가 나와요</p>
      <div id="detail-chart"></div>
    </div>

    <div class="card">
      <h2>QR코드</h2>
      <p class="hint" id="qr-hint">위 표에서 카페를 선택해주세요</p>
      <div class="qr-row" id="qr-wrap"></div>
    </div>
  </section>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, query, orderBy, limit, documentId, doc, setDoc,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  "use strict";

  // index.html과 동일한 Firebase 프로젝트
  const firebaseConfig = {
    apiKey: "AIzaSyDIF97LstMUToykQOJDfrb6aiui7FXBk5c",
    authDomain: "smim-mission-game.firebaseapp.com",
    projectId: "smim-mission-game",
    storageBucket: "smim-mission-game.firebasestorage.app",
    messagingSenderId: "716875617521",
    appId: "1:716875617521:web:787401c9989792534e0550",
  };

  const STATS_DAYS = 14; // 대시보드에 보여줄 최근 일수
  const SITE_BASE_URL = "https://oliviayeonsoo.github.io/smim-mission-game/";
  const qrImageUrl = (url) => `https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(url)}`;

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (sel) => document.querySelector(sel);
  const loginScreen = $("#login-screen");
  const dashScreen = $("#dashboard-screen");
  const emailInput = $("#email-input");
  const passwordInput = $("#password-input");
  const loginBtn = $("#login-btn");
  const loginErr = $("#login-err");

  let cafeStats = [];   // [{id, name, totalVisits, totalPlays, rows: [{date, visits, plays}]}]
  let selectedCafeId = null;

  // ======================================================================
  //  auth
  // ======================================================================
  function friendlyAuthError(code) {
    if (code === "auth/invalid-email") return "이메일 형식이 올바르지 않아요";
    if (code === "auth/user-not-found" || code === "auth/wrong-password" || code === "auth/invalid-credential") {
      return "이메일 또는 비밀번호가 틀렸어요";
    }
    if (code === "auth/too-many-requests") return "잠시 후 다시 시도해주세요";
    return "로그인에 실패했어요";
  }

  async function handleLogin() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      loginErr.textContent = "이메일과 비밀번호를 입력해주세요";
      return;
    }
    loginBtn.disabled = true;
    loginErr.textContent = "";
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      loginErr.textContent = friendlyAuthError(e.code);
    }
    loginBtn.disabled = false;
  }

  loginBtn.addEventListener("click", handleLogin);
  [emailInput, passwordInput].forEach((el) => {
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") handleLogin(); });
  });
  $("#logout-btn").addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.style.display = "none";
      dashScreen.style.display = "block";
      $("#signed-in-as").textContent = user.email;
      loadDashboard();
    } else {
      dashScreen.style.display = "none";
      loginScreen.style.display = "block";
      passwordInput.value = "";
    }
  });

  // ======================================================================
  //  add cafe
  // ======================================================================
  const CAFE_ID_RE = /^[a-z0-9](?:[a-z0-9-]{0,48}[a-z0-9])?$/;

  async function handleAddCafe() {
    const idInput = $("#new-cafe-id");
    const nameInput = $("#new-cafe-name");
    const wifiInput = $("#new-cafe-wifi");
    const adminPwInput2 = $("#new-cafe-admin-pw");
    const msg = $("#add-cafe-msg");
    const btn = $("#add-cafe-btn");

    const cafeId = idInput.value.trim().toLowerCase();
    const name = nameInput.value.trim();
    const wifiPassword = wifiInput.value.trim();
    const adminPassword = adminPwInput2.value.trim();

    if (!cafeId || !CAFE_ID_RE.test(cafeId)) {
      msg.textContent = "카페 아이디는 영문 소문자/숫자/하이픈만 가능해요";
      msg.className = "add-cafe-msg err";
      return;
    }
    if (!name || !wifiPassword || !adminPassword) {
      msg.textContent = "모든 항목을 입력해주세요";
      msg.className = "add-cafe-msg err";
      return;
    }

    btn.disabled = true;
    msg.textContent = "추가하는 중...";
    msg.className = "add-cafe-msg";
    try {
      await setDoc(doc(db, "cafes", cafeId), { name, wifiPassword, adminPassword });
      msg.textContent = `"${name}" 추가 완료! 아래 목록에 곧 나타나요`;
      msg.className = "add-cafe-msg ok";
      idInput.value = ""; nameInput.value = ""; wifiInput.value = ""; adminPwInput2.value = "";
      await loadDashboard();
      selectedCafeId = cafeId;
      renderDetail();
      const row = document.querySelector(`#summary-wrap tr[data-cafe="${cafeId}"]`);
      if (row) { row.classList.add("selected"); row.scrollIntoView({ behavior: "smooth", block: "center" }); }
    } catch (e) {
      console.error("add cafe failed:", e);
      if (e.code === "permission-denied") {
        msg.textContent = "이미 있는 카페 아이디이거나 권한이 없어요";
      } else {
        msg.textContent = "추가에 실패했어요, 다시 시도해주세요";
      }
      msg.className = "add-cafe-msg err";
    }
    btn.disabled = false;
  }

  $("#add-cafe-btn").addEventListener("click", handleAddCafe);

  // ======================================================================
  //  data loading
  // ======================================================================
  function todayKeyList(n) {
    const out = [];
    const d = new Date();
    for (let i = 0; i < n; i++) {
      out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`);
      d.setDate(d.getDate() - 1);
    }
    return out.reverse();
  }

  async function fetchDailyCounts(cafeId, subcollection) {
    const col = collection(db, "cafes", cafeId, subcollection);
    const q = query(col, orderBy(documentId(), "desc"), limit(STATS_DAYS));
    const snap = await getDocs(q);
    const byDate = {};
    snap.forEach((d) => { byDate[d.id] = d.data().count || 0; });
    return byDate;
  }

  async function loadCafeStats(cafeId, name) {
    const [visitsByDate, playsByDate, completionsByDate, copiesByDate] = await Promise.all([
      fetchDailyCounts(cafeId, "visits"),
      fetchDailyCounts(cafeId, "plays"),
      fetchDailyCounts(cafeId, "completions"),
      fetchDailyCounts(cafeId, "copies"),
    ]);
    const rows = todayKeyList(STATS_DAYS).map((date) => ({
      date,
      visits: visitsByDate[date] || 0,
      plays: playsByDate[date] || 0,
      completions: completionsByDate[date] || 0,
      copies: copiesByDate[date] || 0,
    }));
    const totalVisits = rows.reduce((s, r) => s + r.visits, 0);
    const totalPlays = rows.reduce((s, r) => s + r.plays, 0);
    const totalCompletions = rows.reduce((s, r) => s + r.completions, 0);
    const totalCopies = rows.reduce((s, r) => s + r.copies, 0);
    return { id: cafeId, name: name || cafeId, totalVisits, totalPlays, totalCompletions, totalCopies, rows };
  }

  async function loadDashboard() {
    $("#summary-hint").textContent = "불러오는 중...";
    $("#summary-wrap").innerHTML = '<div class="loading"><div class="spinner"></div>카페 목록을 불러오는 중...</div>';

    let cafeDocs;
    try {
      const snap = await getDocs(collection(db, "cafes"));
      cafeDocs = snap.docs.map((d) => ({ id: d.id, name: d.data().name }));
    } catch (e) {
      console.error("cafe list load failed:", e);
      $("#summary-wrap").innerHTML = '<div class="error">카페 목록을 불러오지 못했어요. 로그인 계정 권한을 확인해주세요.</div>';
      $("#summary-hint").textContent = "";
      return;
    }

    if (cafeDocs.length === 0) {
      $("#summary-wrap").innerHTML = '<div class="empty">등록된 카페가 없어요.</div>';
      $("#summary-hint").textContent = "";
      return;
    }

    try {
      cafeStats = await Promise.all(cafeDocs.map((c) => loadCafeStats(c.id, c.name)));
    } catch (e) {
      console.error("stats load failed:", e);
      $("#summary-wrap").innerHTML = '<div class="error">통계를 불러오지 못했어요.</div>';
      $("#summary-hint").textContent = "";
      return;
    }

    cafeStats.sort((a, b) => b.totalVisits - a.totalVisits);
    $("#summary-hint").textContent = `최근 ${STATS_DAYS}일 기준 · 카페 ${cafeStats.length}곳`;
    renderSummaryTable();

    selectedCafeId = cafeStats[0].id;
    renderDetail();
  }

  // ======================================================================
  //  rendering
  // ======================================================================
  function renderSummaryTable() {
    const rate = (num, den) => (den > 0 ? `${Math.round((num / den) * 100)}%` : "–");
    const rows = cafeStats.map((c) => `
        <tr data-cafe="${c.id}" class="${c.id === selectedCafeId ? "selected" : ""}">
          <td class="name">${c.name}</td>
          <td class="num">${c.totalVisits}</td>
          <td class="num">${c.totalPlays}</td>
          <td class="num">${c.totalCompletions}</td>
          <td class="num">${c.totalCopies}</td>
          <td class="num">${rate(c.totalCompletions, c.totalVisits)}</td>
        </tr>`).join("");

    const totalVisits = cafeStats.reduce((s, c) => s + c.totalVisits, 0);
    const totalPlays = cafeStats.reduce((s, c) => s + c.totalPlays, 0);
    const totalCompletions = cafeStats.reduce((s, c) => s + c.totalCompletions, 0);
    const totalCopies = cafeStats.reduce((s, c) => s + c.totalCopies, 0);

    $("#summary-wrap").innerHTML = `
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>카페</th><th class="num">방문</th><th class="num">참여</th><th class="num">완료</th><th class="num">비번복사</th><th class="num">완료율</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>합계</td><td class="num">${totalVisits}</td><td class="num">${totalPlays}</td><td class="num">${totalCompletions}</td><td class="num">${totalCopies}</td><td class="num">${rate(totalCompletions, totalVisits)}</td></tr></tfoot>
      </table>
      </div>`;

    $("#summary-wrap").querySelectorAll("tbody tr").forEach((tr) => {
      tr.addEventListener("click", () => {
        selectedCafeId = tr.dataset.cafe;
        $("#summary-wrap").querySelectorAll("tbody tr").forEach((r) => r.classList.toggle("selected", r === tr));
        renderDetail();
      });
    });
  }

  function renderChart(rows) {
    const w = 640, h = 150, barGap = 2, groupGap = 8;
    const groupW = rows.length ? (w / rows.length) - groupGap : 0;
    const barW = Math.max(1, (groupW - barGap * 2) / 3);
    const series = [
      { key: "visits", color: "#346d5e" },
      { key: "completions", color: "#8fc9ae" },
      { key: "copies", color: "#e3b23c" },
    ];
    const max = Math.max(1, ...rows.map((r) => Math.max(r.visits, r.completions, r.copies)));
    let bars = "";
    rows.forEach((r, i) => {
      const gx = i * (groupW + groupGap);
      series.forEach((s, si) => {
        const val = r[s.key];
        const bh = val > 0 ? Math.max(3, (val / max) * (h - 26)) : 2;
        const bx = gx + si * (barW + barGap);
        bars += `<rect x="${bx.toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${val > 0 ? s.color : "#e7efe9"}"/>`;
      });
      bars += `<text x="${(gx + groupW / 2).toFixed(1)}" y="${h + 15}" font-size="9" fill="#8aa598" text-anchor="middle" font-family="Pretendard">${r.date.slice(5).replace("-", "/")}</text>`;
    });
    return `
      <div class="chart-legend"><span class="dot" style="background:#346d5e"></span>방문<span class="dot" style="background:#8fc9ae"></span>완료<span class="dot" style="background:#e3b23c"></span>비번복사</div>
      <svg viewBox="0 0 ${w} ${h + 24}">${bars}</svg>
    `;
  }

  function renderQR(cafe) {
    const url = `${SITE_BASE_URL}?cafe=${encodeURIComponent(cafe.id)}`;
    $("#qr-hint").textContent = `${cafe.name}의 접속 QR코드예요`;
    $("#qr-wrap").innerHTML = `
      <img src="${qrImageUrl(url)}" alt="${cafe.name} QR코드">
      <div class="qr-info">
        <div class="qr-url">${url}</div>
        <div class="qr-actions">
          <a class="link-btn" href="${qrImageUrl(url)}&size=1000x1000" download="${cafe.id}-qr.png" target="_blank" rel="noopener">QR 다운로드</a>
          <a class="link-btn" href="${url}" target="_blank" rel="noopener">링크 열기</a>
          <button class="link-btn" id="copy-url-btn" type="button">링크 복사</button>
        </div>
      </div>`;
    const copyBtn = $("#copy-url-btn");
    if (copyBtn) {
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(url);
          copyBtn.textContent = "복사됨 ✓";
          setTimeout(() => { copyBtn.textContent = "링크 복사"; }, 1500);
        } catch (e) {}
      });
    }
  }

  function renderDetail() {
    const cafe = cafeStats.find((c) => c.id === selectedCafeId);
    if (!cafe) return;
    $("#detail-title").textContent = `${cafe.name} · 일별 추이`;
    $("#detail-chart").innerHTML = renderChart(cafe.rows);
    renderQR(cafe);
  }
</script>
</body>
</html>
