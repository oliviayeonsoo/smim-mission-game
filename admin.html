<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMIM · 운영자 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  @font-face{font-family:'HS굴토끼체';src:url('assets/fonts/HSGooltokki.ttf') format('truetype');font-display:swap;}
  :root { color-scheme: light; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:#f5f9f4;font-family:'Pretendard',system-ui,sans-serif;color:#2d4a3e;}
  .title-font{font-family:'HS굴토끼체',system-ui,sans-serif;font-weight:400;}
  @keyframes spin{to{transform:rotate(360deg)}}

  #stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#eef4ec;}

  /* ---------- login ---------- */
  #login-screen{width:100%;max-width:360px;text-align:center;}
  #login-screen h1{margin:0 0 6px;font-size:26px;color:#315c51;}
  #login-screen p.sub{margin:0 0 26px;font-size:14px;font-weight:300;color:#6f8b7f;}
  .field{margin-bottom:12px;text-align:left;}
  .input{width:100%;box-sizing:border-box;padding:13px 15px;border-radius:14px;border:1px solid #d8e4dc;background:#fff;color:#2d4a3e;font-size:15px;font-family:'Pretendard';outline:none;}
  .input:focus{border-color:#346d5e;}
  .btn{width:100%;border:none;cursor:pointer;padding:15px;border-radius:14px;background:#346d5e;color:#e3e79b;font-family:'Pretendard';font-weight:700;font-size:16px;box-shadow:0 10px 26px rgba(52,109,94,.25);transition:filter .15s;margin-top:6px;}
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.55;cursor:default;}
  .err{min-height:16px;margin:10px 0 0;font-size:12.5px;color:#c0392b;}

  /* ---------- dashboard ---------- */
  #dashboard-screen{width:100%;max-width:760px;display:none;}
  .dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .dash-header h1{margin:0;font-size:22px;color:#315c51;}
  .dash-header p{margin:2px 0 0;font-size:12.5px;color:#8aa598;}
  .logout-btn{border:none;cursor:pointer;padding:9px 16px;border-radius:12px;background:#fff;border:1px solid #d8e4dc;color:#3f6459;font-size:13px;font-family:'Pretendard';}
  .logout-btn:hover{background:#eef4ec;}

  .card{border-radius:22px;background:#fff;border:1px solid #e4ede3;padding:22px;margin-bottom:18px;}
  .card h2{margin:0 0 4px;font-size:15px;font-weight:600;color:#2d4a3e;}
  .card p.hint{margin:0 0 16px;font-size:12.5px;color:#8aa598;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eef2ed;}
  th{font-size:11.5px;font-weight:500;color:#8aa598;letter-spacing:.3px;text-transform:uppercase;}
  tbody tr{cursor:pointer;transition:background .12s;}
  tbody tr:hover{background:#f5f9f4;}
  tbody tr.selected{background:#e9f3ec;}
  td.num,th.num{text-align:right;font-family:'JetBrains Mono',monospace;}
  td.name{font-weight:600;color:#2d4a3e;}
  tfoot td{border-bottom:none;border-top:1px solid #d8e4dc;font-weight:700;color:#315c51;padding-top:12px;}

  .chart-legend{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:12px;color:#6f8b7f;}
  .chart-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:12px;}
  .chart-legend .dot:first-child{margin-left:0;}
  #detail-chart svg{display:block;width:100%;}

  .loading,.empty,.error{padding:20px 0;text-align:center;font-size:13.5px;color:#8aa598;}
  .spinner{width:26px;height:26px;margin:0 auto 10px;border-radius:50%;border:3px solid #d8e4dc;border-top-color:#346d5e;animation:spin .8s linear infinite;}
  .error{color:#c0392b;}
</style>
</head>
<body>

<div id="stage">

  <!-- ============ LOGIN ============ -->
  <section id="login-screen">
    <h1 class="title-font">운영자 대시보드</h1>
    <p class="sub">전체 카페의 방문·참여 통계를 확인해요</p>
    <div class="field">
      <input id="email-input" type="email" class="input" placeholder="이메일" autocomplete="username">
    </div>
    <div class="field">
      <input id="password-input" type="password" class="input" placeholder="비밀번호" autocomplete="current-password">
    </div>
    <button class="btn" id="login-btn">로그인</button>
    <p class="err" id="login-err"></p>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <section id="dashboard-screen">
    <div class="dash-header">
      <div>
        <h1 class="title-font">SMIM 운영자 대시보드</h1>
        <p id="signed-in-as"></p>
      </div>
      <button class="logout-btn" id="logout-btn">로그아웃</button>
    </div>

    <div class="card">
      <h2>카페별 요약</h2>
      <p class="hint" id="summary-hint">불러오는 중...</p>
      <div id="summary-wrap"></div>
    </div>

    <div class="card">
      <h2 id="detail-title">일별 추이</h2>
      <p class="hint">표에서 카페를 선택하면 여기에 날짜별 방문·참여가 나와요</p>
      <div id="detail-chart"></div>
    </div>
  </section>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, query, orderBy, limit, documentId,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  "use strict";

  // index.html과 동일한 Firebase 프로젝트
  const firebaseConfig = {
    apiKey: "AIzaSyDIF97LstMUToykQOJDfrb6aiui7FXBk5c",
    authDomain: "smim-mission-game.firebaseapp.com",
    projectId: "smim-mission-game",
    storageBucket: "smim-mission-game.firebasestorage.app",
    messagingSenderId: "716875617521",
    appId: "1:716875617521:web:787401c9989792534e0550",
  };

  const STATS_DAYS = 14; // 대시보드에 보여줄 최근 일수

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (sel) => document.querySelector(sel);
  const loginScreen = $("#login-screen");
  const dashScreen = $("#dashboard-screen");
  const emailInput = $("#email-input");
  const passwordInput = $("#password-input");
  const loginBtn = $("#login-btn");
  const loginErr = $("#login-err");

  let cafeStats = [];   // [{id, name, totalVisits, totalPlays, rows: [{date, visits, plays}]}]
  let selectedCafeId = null;

  // ======================================================================
  //  auth
  // ======================================================================
  function friendlyAuthError(code) {
    if (code === "auth/invalid-email") return "이메일 형식이 올바르지 않아요";
    if (code === "auth/user-not-found" || code === "auth/wrong-password" || code === "auth/invalid-credential") {
      return "이메일 또는 비밀번호가 틀렸어요";
    }
    if (code === "auth/too-many-requests") return "잠시 후 다시 시도해주세요";
    return "로그인에 실패했어요";
  }

  async function handleLogin() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      loginErr.textContent = "이메일과 비밀번호를 입력해주세요";
      return;
    }
    loginBtn.disabled = true;
    loginErr.textContent = "";
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      loginErr.textContent = friendlyAuthError(e.code);
    }
    loginBtn.disabled = false;
  }

  loginBtn.addEventListener("click", handleLogin);
  [emailInput, passwordInput].forEach((el) => {
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") handleLogin(); });
  });
  $("#logout-btn").addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.style.display = "none";
      dashScreen.style.display = "block";
      $("#signed-in-as").textContent = user.email;
      loadDashboard();
    } else {
      dashScreen.style.display = "none";
      loginScreen.style.display = "block";
      passwordInput.value = "";
    }
  });

  // ======================================================================
  //  data loading
  // ======================================================================
  function todayKeyList(n) {
    const out = [];
    const d = new Date();
    for (let i = 0; i < n; i++) {
      out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`);
      d.setDate(d.getDate() - 1);
    }
    return out.reverse();
  }

  async function fetchDailyCounts(cafeId, subcollection) {
    const col = collection(db, "cafes", cafeId, subcollection);
    const q = query(col, orderBy(documentId(), "desc"), limit(STATS_DAYS));
    const snap = await getDocs(q);
    const byDate = {};
    snap.forEach((d) => { byDate[d.id] = d.data().count || 0; });
    return byDate;
  }

  async function loadCafeStats(cafeId, name) {
    const [visitsByDate, playsByDate] = await Promise.all([
      fetchDailyCounts(cafeId, "visits"),
      fetchDailyCounts(cafeId, "plays"),
    ]);
    const rows = todayKeyList(STATS_DAYS).map((date) => ({
      date,
      visits: visitsByDate[date] || 0,
      plays: playsByDate[date] || 0,
    }));
    const totalVisits = rows.reduce((s, r) => s + r.visits, 0);
    const totalPlays = rows.reduce((s, r) => s + r.plays, 0);
    return { id: cafeId, name: name || cafeId, totalVisits, totalPlays, rows };
  }

  async function loadDashboard() {
    $("#summary-hint").textContent = "불러오는 중...";
    $("#summary-wrap").innerHTML = '<div class="loading"><div class="spinner"></div>카페 목록을 불러오는 중...</div>';

    let cafeDocs;
    try {
      const snap = await getDocs(collection(db, "cafes"));
      cafeDocs = snap.docs.map((d) => ({ id: d.id, name: d.data().name }));
    } catch (e) {
      console.error("cafe list load failed:", e);
      $("#summary-wrap").innerHTML = '<div class="error">카페 목록을 불러오지 못했어요. 로그인 계정 권한을 확인해주세요.</div>';
      $("#summary-hint").textContent = "";
      return;
    }

    if (cafeDocs.length === 0) {
      $("#summary-wrap").innerHTML = '<div class="empty">등록된 카페가 없어요.</div>';
      $("#summary-hint").textContent = "";
      return;
    }

    try {
      cafeStats = await Promise.all(cafeDocs.map((c) => loadCafeStats(c.id, c.name)));
    } catch (e) {
      console.error("stats load failed:", e);
      $("#summary-wrap").innerHTML = '<div class="error">통계를 불러오지 못했어요.</div>';
      $("#summary-hint").textContent = "";
      return;
    }

    cafeStats.sort((a, b) => b.totalVisits - a.totalVisits);
    $("#summary-hint").textContent = `최근 ${STATS_DAYS}일 기준 · 카페 ${cafeStats.length}곳`;
    renderSummaryTable();

    selectedCafeId = cafeStats[0].id;
    renderDetail();
  }

  // ======================================================================
  //  rendering
  // ======================================================================
  function renderSummaryTable() {
    const rows = cafeStats.map((c) => {
      const rate = c.totalVisits > 0 ? `${Math.round((c.totalPlays / c.totalVisits) * 100)}%` : "–";
      return `
        <tr data-cafe="${c.id}" class="${c.id === selectedCafeId ? "selected" : ""}">
          <td class="name">${c.name}</td>
          <td class="num">${c.totalVisits}</td>
          <td class="num">${c.totalPlays}</td>
          <td class="num">${rate}</td>
        </tr>`;
    }).join("");

    const totalVisits = cafeStats.reduce((s, c) => s + c.totalVisits, 0);
    const totalPlays = cafeStats.reduce((s, c) => s + c.totalPlays, 0);
    const totalRate = totalVisits > 0 ? `${Math.round((totalPlays / totalVisits) * 100)}%` : "–";

    $("#summary-wrap").innerHTML = `
      <table>
        <thead><tr><th>카페</th><th class="num">방문</th><th class="num">참여</th><th class="num">참여율</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>합계</td><td class="num">${totalVisits}</td><td class="num">${totalPlays}</td><td class="num">${totalRate}</td></tr></tfoot>
      </table>`;

    $("#summary-wrap").querySelectorAll("tbody tr").forEach((tr) => {
      tr.addEventListener("click", () => {
        selectedCafeId = tr.dataset.cafe;
        $("#summary-wrap").querySelectorAll("tbody tr").forEach((r) => r.classList.toggle("selected", r === tr));
        renderDetail();
      });
    });
  }

  function renderChart(rows) {
    const w = 640, h = 140, barGap = 3, groupGap = 6;
    const groupW = rows.length ? (w / rows.length) - groupGap : 0;
    const barW = Math.max(1, (groupW - barGap) / 2);
    const max = Math.max(1, ...rows.map((r) => Math.max(r.visits, r.plays)));
    let bars = "";
    rows.forEach((r, i) => {
      const gx = i * (groupW + groupGap);
      const vH = r.visits > 0 ? Math.max(3, (r.visits / max) * (h - 26)) : 2;
      const pH = r.plays > 0 ? Math.max(3, (r.plays / max) * (h - 26)) : 2;
      bars += `<rect x="${gx.toFixed(1)}" y="${(h - vH).toFixed(1)}" width="${barW.toFixed(1)}" height="${vH.toFixed(1)}" rx="2" fill="${r.visits > 0 ? "#346d5e" : "#e7efe9"}"/>`;
      bars += `<rect x="${(gx + barW + barGap).toFixed(1)}" y="${(h - pH).toFixed(1)}" width="${barW.toFixed(1)}" height="${pH.toFixed(1)}" rx="2" fill="${r.plays > 0 ? "#8fc9ae" : "#e7efe9"}"/>`;
      bars += `<text x="${(gx + groupW / 2).toFixed(1)}" y="${h + 15}" font-size="9" fill="#8aa598" text-anchor="middle" font-family="Pretendard">${r.date.slice(5).replace("-", "/")}</text>`;
    });
    return `
      <div class="chart-legend"><span class="dot" style="background:#346d5e"></span>방문<span class="dot" style="background:#8fc9ae"></span>참여</div>
      <svg viewBox="0 0 ${w} ${h + 24}">${bars}</svg>
    `;
  }

  function renderDetail() {
    const cafe = cafeStats.find((c) => c.id === selectedCafeId);
    if (!cafe) return;
    $("#detail-title").textContent = `${cafe.name} · 일별 추이`;
    $("#detail-chart").innerHTML = renderChart(cafe.rows);
  }
</script>
</body>
</html>
